name: Type Check

on:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml"]
  pull_request:
    paths: ["src/**", "pyproject.toml"]

jobs:
  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        # uv's portable builds also support older Python pins on newer runners.
        run: uv python install

      - name: Install dependencies
        run: uv sync

      - name: Run Pyrefly
        run: uv run pyrefly check --output-format=github
